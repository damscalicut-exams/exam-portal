<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DAMS Calicut — Exam Admin</title>
<style>
:root{ --maroon:#8f141d; --maroon-dark:#5e0d13; --gold:#c9a227; --ink:#1a1612; --paper:#fff; --muted:#6b6258; --line:#e7e0d6; --cream:#f7f3ec; }
*{box-sizing:border-box; margin:0; padding:0;}
body{font-family:'Segoe UI',Arial,sans-serif; background:var(--cream); color:var(--ink);}
header{background:var(--maroon); color:#fff; padding:16px 20px; font-weight:800; font-size:19px; display:flex; justify-content:space-between; align-items:center;}
header button{background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.4); color:#fff; padding:7px 14px; border-radius:7px; cursor:pointer; font-size:13px;}
.wrap{max-width:1000px; margin:0 auto; padding:22px 16px 60px;}
.card{background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:20px; margin-bottom:20px; box-shadow:0 8px 20px -14px rgba(0,0,0,.2);}
h2{font-size:16px; margin-bottom:14px; color:var(--maroon-dark);}
label{display:block; font-size:12.5px; font-weight:700; margin:10px 0 5px;}
input[type=text], input[type=number], textarea, select{width:100%; padding:9px 11px; border:1.5px solid var(--line); border-radius:7px; font-size:14px; font-family:inherit;}
textarea{resize:vertical; min-height:60px;}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.btn{background:var(--maroon); color:#fff; border:none; padding:10px 20px; border-radius:7px; font-weight:700; font-size:14px; cursor:pointer; margin-top:14px;}
.btn:hover{background:var(--maroon-dark);}
.btn.secondary{background:#fff; color:var(--maroon); border:1.5px solid var(--maroon);}
.btn.danger{background:#a33;}
.btn:disabled{background:#bbb; cursor:not-allowed;}
table{width:100%; border-collapse:collapse; font-size:13px; margin-top:10px;}
th, td{text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top;}
th{background:var(--cream); font-size:12px; text-transform:uppercase; letter-spacing:.3px;}
.pill{display:inline-block; background:var(--cream); border:1px solid var(--line); padding:3px 9px; border-radius:20px; font-size:11.5px; font-weight:700;}
.msg{padding:10px 13px; border-radius:7px; font-size:13.5px; margin:10px 0; display:none;}
.msg.show{display:block;}
.msg.error{background:#fde8e8; color:#a33;}
.msg.success{background:#e8f8ee; color:#1a7a3e;}
.hidden{display:none;}
.loginWrap{max-width:360px; margin:80px auto;}
.imgPreview{max-width:160px; border-radius:6px; margin-top:8px; display:block;}
.row-actions button{font-size:12px; padding:5px 10px; margin-right:6px;}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="loginWrap" id="loginView">
  <div class="card">
    <h2>DAMS Calicut — Exam Admin</h2>
    <label>Admin Password</label>
    <input type="text" id="loginPassword" placeholder="Enter team password">
    <div id="loginMsg" class="msg error"></div>
    <button class="btn" onclick="login()">Log In</button>
  </div>
</div>

<!-- ADMIN PANEL -->
<div id="adminView" class="hidden">
  <header>
    <span>DAMS Calicut — Exam Admin</span>
    <button onclick="logout()">Log out</button>
  </header>

  <div class="wrap">

    <!-- ACTIVE TEST -->
    <div class="card">
      <h2>This Week's Active Test</h2>
      <div id="testsMsg" class="msg"></div>
      <table id="testsTable"><thead><tr><th>Test Tag</th><th>Title</th><th>Duration</th><th>Active</th><th></th></tr></thead><tbody></tbody></table>
      <h2 style="margin-top:20px;">Create New Test</h2>
      <div class="grid2">
        <div><label>Test Tag (no spaces, e.g. Week13)</label><input type="text" id="newTestTag"></div>
        <div><label>Duration (minutes)</label><input type="number" id="newTestDuration" value="30"></div>
      </div>
      <label>Display Title</label>
      <input type="text" id="newTestTitle" placeholder="e.g. DAMS Weekly Test - Week 13">
      <button class="btn secondary" onclick="addTest()">+ Add Test</button>
    </div>

    <!-- ADD / EDIT QUESTION -->
    <div class="card">
      <h2 id="formHeading">Add a Question</h2>
      <div id="qMsg" class="msg"></div>
      <input type="hidden" id="editId">
      <div class="grid2">
        <div><label>Test Tag</label><input type="text" id="q-testTag" placeholder="e.g. Week13"></div>
        <div><label>Subject</label><input type="text" id="q-subject" placeholder="e.g. Microbiology"></div>
      </div>
      <label>Question Text</label>
      <textarea id="q-text"></textarea>
      <label>Image (optional)</label>
      <input type="file" id="q-imageFile" accept="image/*" onchange="previewImage()">
      <img id="imgPreview" class="imgPreview hidden">
      <input type="hidden" id="q-imageUrl">
      <div class="grid2" style="margin-top:10px;">
        <div><label>Option A</label><input type="text" id="q-a"></div>
        <div><label>Option B</label><input type="text" id="q-b"></div>
        <div><label>Option C</label><input type="text" id="q-c"></div>
        <div><label>Option D</label><input type="text" id="q-d"></div>
      </div>
      <label>Correct Option</label>
      <select id="q-correct"><option>A</option><option>B</option><option>C</option><option>D</option></select>
      <label>Explanation</label>
      <textarea id="q-explanation"></textarea>
      <button class="btn" id="saveBtn" onclick="saveQuestion()">Save Question</button>
      <button class="btn secondary hidden" id="cancelEditBtn" onclick="resetForm()">Cancel Edit</button>
    </div>

    <!-- QUESTION BANK -->
    <div class="card">
      <h2>Question Bank</h2>
      <label>Filter by Test Tag</label>
      <input type="text" id="filterTag" placeholder="Leave blank to show all" oninput="renderQuestionTable()">
      <table id="qTable"><thead><tr><th>Test</th><th>Subject</th><th>Question</th><th>Correct</th><th></th></tr></thead><tbody></tbody></table>
    </div>

  </div>
</div>

<script>
// ===================== CONFIG =====================
const API_URL = "PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE";
// ====================================================

let password = '';
let allQuestions = [];
let allTests = [];

function login() {
  password = document.getElementById('loginPassword').value.trim();
  if (!password) return;
  loadAll();
}

function logout() {
  password = '';
  document.getElementById('adminView').classList.add('hidden');
  document.getElementById('loginView').classList.remove('hidden');
}

async function loadAll() {
  try {
    const [qRes, tRes] = await Promise.all([
      fetch(`${API_URL}?action=adminListQuestions&password=${encodeURIComponent(password)}`),
      fetch(`${API_URL}?action=adminListTests&password=${encodeURIComponent(password)}`)
    ]);
    const qData = await qRes.json();
    const tData = await tRes.json();
    if (qData.error) throw new Error(qData.error);

    allQuestions = qData;
    allTests = tData;
    document.getElementById('loginView').classList.add('hidden');
    document.getElementById('adminView').classList.remove('hidden');
    renderQuestionTable();
    renderTestsTable();
  } catch (err) {
    document.getElementById('loginMsg').textContent = 'Incorrect password or connection error.';
    document.getElementById('loginMsg').classList.add('show');
  }
}

function showMsg(id, text, type) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = 'msg show ' + type;
  setTimeout(() => el.classList.remove('show'), 4000);
}

/* ---------- TESTS ---------- */
function renderTestsTable() {
  const tbody = document.querySelector('#testsTable tbody');
  tbody.innerHTML = allTests.map(t => `
    <tr>
      <td>${t.TestTag}</td>
      <td>${t.Title}</td>
      <td>${t.DurationMinutes} min</td>
      <td>${String(t.Active).toUpperCase() === 'TRUE' ? '<span class="pill">ACTIVE</span>' : ''}</td>
      <td><button class="btn secondary" onclick="makeActive('${t.TestTag}')">Make Active</button></td>
    </tr>
  `).join('');
}

async function addTest() {
  const testTag = document.getElementById('newTestTag').value.trim();
  const title = document.getElementById('newTestTitle').value.trim();
  const durationMinutes = document.getElementById('newTestDuration').value;
  if (!testTag || !title) { showMsg('testsMsg', 'Enter a test tag and title.', 'error'); return; }

  const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'adminAddTest', password, testTag, title, durationMinutes }) });
  const data = await res.json();
  if (data.success) {
    showMsg('testsMsg', 'Test added.', 'success');
    document.getElementById('newTestTag').value = '';
    document.getElementById('newTestTitle').value = '';
    loadAll();
  } else {
    showMsg('testsMsg', data.error || 'Failed to add test.', 'error');
  }
}

async function makeActive(testTag) {
  const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'adminSetActiveTest', password, testTag }) });
  const data = await res.json();
  if (data.success) {
    showMsg('testsMsg', `"${testTag}" is now the active test students see.`, 'success');
    loadAll();
  }
}

/* ---------- IMAGE UPLOAD ---------- */
function previewImage() {
  const file = document.getElementById('q-imageFile').files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async (e) => {
    const base64 = e.target.result;
    document.getElementById('imgPreview').src = base64;
    document.getElementById('imgPreview').classList.remove('hidden');
    showMsg('qMsg', 'Uploading image...', 'success');
    const res = await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'adminUploadImage', password, imageBase64: base64, filename: file.name })
    });
    const data = await res.json();
    if (data.success) {
      document.getElementById('q-imageUrl').value = data.url;
      showMsg('qMsg', 'Image uploaded.', 'success');
    } else {
      showMsg('qMsg', data.error || 'Image upload failed.', 'error');
    }
  };
  reader.readAsDataURL(file);
}

/* ---------- QUESTIONS ---------- */
function renderQuestionTable() {
  const filter = document.getElementById('filterTag').value.trim().toLowerCase();
  const tbody = document.querySelector('#qTable tbody');
  const rows = allQuestions.filter(q => !filter || String(q.TestTag).toLowerCase().includes(filter));
  tbody.innerHTML = rows.map(q => `
    <tr>
      <td><span class="pill">${q.TestTag}</span></td>
      <td>${q.Subject || ''}</td>
      <td>${String(q.QuestionText).slice(0, 70)}${String(q.QuestionText).length > 70 ? '…' : ''}</td>
      <td>${q.CorrectOption}</td>
      <td class="row-actions">
        <button class="btn secondary" onclick='editQuestion(${JSON.stringify(q.ID)})'>Edit</button>
        <button class="btn danger" onclick='deleteQuestion(${JSON.stringify(q.ID)})'>Delete</button>
      </td>
    </tr>
  `).join('');
}

function editQuestion(id) {
  const q = allQuestions.find(x => x.ID === id);
  if (!q) return;
  document.getElementById('editId').value = q.ID;
  document.getElementById('q-testTag').value = q.TestTag;
  document.getElementById('q-subject').value = q.Subject;
  document.getElementById('q-text').value = q.QuestionText;
  document.getElementById('q-imageUrl').value = q.ImageURL || '';
  if (q.ImageURL) {
    document.getElementById('imgPreview').src = q.ImageURL;
    document.getElementById('imgPreview').classList.remove('hidden');
  }
  document.getElementById('q-a').value = q.OptionA;
  document.getElementById('q-b').value = q.OptionB;
  document.getElementById('q-c').value = q.OptionC;
  document.getElementById('q-d').value = q.OptionD;
  document.getElementById('q-correct').value = q.CorrectOption;
  document.getElementById('q-explanation').value = q.Explanation;
  document.getElementById('formHeading').textContent = 'Edit Question';
  document.getElementById('cancelEditBtn').classList.remove('hidden');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function resetForm() {
  document.getElementById('editId').value = '';
  ['q-testTag','q-subject','q-text','q-imageUrl','q-a','q-b','q-c','q-d','q-explanation'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('q-correct').value = 'A';
  document.getElementById('imgPreview').classList.add('hidden');
  document.getElementById('formHeading').textContent = 'Add a Question';
  document.getElementById('cancelEditBtn').classList.add('hidden');
}

async function saveQuestion() {
  const id = document.getElementById('editId').value;
  const payload = {
    password,
    testTag: document.getElementById('q-testTag').value.trim(),
    subject: document.getElementById('q-subject').value.trim(),
    questionText: document.getElementById('q-text').value.trim(),
    imageUrl: document.getElementById('q-imageUrl').value.trim(),
    optionA: document.getElementById('q-a').value.trim(),
    optionB: document.getElementById('q-b').value.trim(),
    optionC: document.getElementById('q-c').value.trim(),
    optionD: document.getElementById('q-d').value.trim(),
    correctOption: document.getElementById('q-correct').value,
    explanation: document.getElementById('q-explanation').value.trim()
  };
  if (!payload.testTag || !payload.questionText || !payload.optionA || !payload.optionB) {
    showMsg('qMsg', 'Fill in at least the test tag, question text, and options.', 'error');
    return;
  }

  payload.action = id ? 'adminUpdateQuestion' : 'adminAddQuestion';
  if (id) payload.id = id;

  const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
  const data = await res.json();
  if (data.success) {
    showMsg('qMsg', id ? 'Question updated.' : 'Question added.', 'success');
    resetForm();
    loadAll();
  } else {
    showMsg('qMsg', data.error || 'Failed to save question.', 'error');
  }
}

async function deleteQuestion(id) {
  if (!confirm('Delete this question permanently?')) return;
  const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'adminDeleteQuestion', password, id }) });
  const data = await res.json();
  if (data.success) {
    showMsg('qMsg', 'Question deleted.', 'success');
    loadAll();
  }
}
</script>
</body>
</html>
